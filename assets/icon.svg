<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital Wellbeing">
  <defs>
    <linearGradient id="tile" x1="64" y1="0" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16171F"/>
      <stop offset="1" stop-color="#101119"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="58" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="126" height="126" rx="28" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <rect x="1" y="1" width="126" height="126" rx="28" fill="url(#glow)"/>

  <!-- sand settled in the lower bulb -->
  <path d="M54 80 H74 L82 93 H46 Z" fill="#6E8BFF"/>
  <!-- a grain mid-fall -->
  <circle cx="64" cy="70" r="2.5" fill="#6E8BFF"/>

  <!-- hourglass frame -->
  <g stroke="#C9CEF7" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 32 H90"/>
    <path d="M38 96 H90"/>
    <path d="M43 32 L64 64 L43 96"/>
    <path d="M85 32 L64 64 L85 96"/>
  </g>
</svg>
